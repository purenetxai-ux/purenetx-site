<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms – purenetX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg:#050810; --border:rgba(255,255,255,0.08); --border-h:rgba(99,202,255,0.35); --cyan:#63caff; --cyan2:#3af0d0; --text:#e8edf5; --muted:#7a8598; --card-bg:rgba(10,18,40,0.7); }
    html { scroll-behavior: smooth; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; line-height:1.6; cursor:none; }
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--cyan2));border-radius:2px}
    #cursor{width:10px;height:10px;background:var(--cyan);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen}
    #cursor-ring{width:36px;height:36px;border:1px solid rgba(99,202,255,0.45);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s ease}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.025;pointer-events:none;z-index:1000}
    .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(99,202,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,202,255,0.04) 1px,transparent 1px);background-size:60px 60px;z-index:0;pointer-events:none;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
    .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,rgba(37,99,235,0.12) 0%,transparent 70%);top:-100px;left:-100px}
    .orb-2{width:400px;height:400px;background:radial-gradient(circle,rgba(99,202,255,0.08) 0%,transparent 70%);bottom:-80px;right:-80px;animation-delay:-9s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.08)}}
    nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:0 clamp(1.5rem,5vw,4rem);height:70px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,8,16,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
    .nav-logo img{height:32px;width:auto;mix-blend-mode:screen;filter:brightness(1.4) contrast(1.1) drop-shadow(0 0 8px rgba(99,202,255,0.5))}
    .nav-links{display:flex;align-items:center;gap:2rem;list-style:none}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;letter-spacing:.03em;text-transform:uppercase;transition:color .25s;position:relative}
    .nav-links a::after{content:'';position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--cyan);transition:width .3s}
    .nav-links a:hover,.nav-links a.active{color:var(--cyan)}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    .page-wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:140px clamp(1.5rem,6vw,3rem) 100px}
    .page-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem 1rem;border:1px solid rgba(99,202,255,0.25);border-radius:100px;background:rgba(99,202,255,0.07);font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:2rem;opacity:0;animation:fadeUp .7s .2s forwards}
    h1{font-family:'Syne',sans-serif;font-size:clamp(2.2rem,5vw,4rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;background:linear-gradient(135deg,#ffffff 0%,#c8deff 40%,var(--cyan) 70%,var(--cyan2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fadeUp .8s .35s forwards}
    .divider-line{width:60px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));border-radius:2px;margin:2.5rem 0;opacity:0;animation:fadeUp .8s .5s forwards}
    .terms-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:2rem 2.2rem;backdrop-filter:blur(16px);position:relative;overflow:hidden;opacity:0;transform:translateY(20px);transition:border-color .3s,box-shadow .3s,opacity .6s,transform .6s}
    .terms-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.4}
    .terms-card:hover{border-color:var(--border-h);box-shadow:0 20px 60px rgba(99,202,255,0.08)}
    .terms-card.visible{opacity:1;transform:translateY(0)}
    .terms-card p{color:var(--muted);font-size:.95rem;line-height:1.75;font-weight:300}
    .back-link{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;margin-top:2rem;border:1px solid var(--border);border-radius:8px;padding:.6rem 1.2rem;transition:color .25s,border-color .25s,transform .25s;opacity:0;animation:fadeUp .8s .8s forwards}
    .back-link:hover{color:var(--cyan);border-color:rgba(99,202,255,0.3);transform:translateX(-3px)}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:2.5rem clamp(1.5rem,6vw,5rem);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;background:rgba(5,8,16,0.7);backdrop-filter:blur(20px)}
    .footer-logo img{height:28px;mix-blend-mode:screen;filter:brightness(1.4) contrast(1.1) drop-shadow(0 0 6px rgba(99,202,255,0.4))}
    .footer-copy{font-size:.8rem;color:var(--muted)}
    .footer-links{display:flex;gap:1.5rem;list-style:none}
    .footer-links a{color:var(--muted);text-decoration:none;font-size:.82rem;transition:color .25s}
    .footer-links a:hover{color:var(--cyan)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:640px){footer{justify-content:center;text-align:center}.footer-links{justify-content:center}}
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid-bg"></div>

  <nav>
    <a href="/" class="nav-logo"><img src="https://www.purenetx.com/logo.png" alt="purenetX" /></a>
    <ul class="nav-links">
      <li><a href="/about.html">About</a></li>
      <li><a href="/privacy-policy.html">Privacy</a></li>
      <li><a href="/terms.html" class="active">Terms</a></li>
    </ul>
  </nav>

  <div class="page-wrap">
    <span class="page-badge">Legal</span>
    <h1>Terms &amp; Conditions</h1>
    <div class="divider-line"></div>

    <div class="terms-card">
      <p>This website is provided for informational purposes only.</p>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
  </div>

  <footer>
    <div class="footer-logo"><img src="https://www.purenetx.com/logo.png" alt="purenetX" /></div>
    <p class="footer-copy">© 2026 purenetX. All rights reserved.</p>
    <ul class="footer-links">
      <li><a href="/about.html">About</a></li>
      <li><a href="/privacy-policy.html">Privacy</a></li>
      <li><a href="/terms.html">Terms</a></li>
    </ul>
  </footer>

  <script>
    const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    (function tick(){cur.style.left=mx+'px';cur.style.top=my+'px';rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(tick)})();
    const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.15});
    document.querySelectorAll('.terms-card').forEach(el=>io.observe(el));
  </script>
</body>
</html>
